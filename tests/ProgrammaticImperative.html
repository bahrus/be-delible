<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic Imperative</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Fully imperative attachment: no attribute, no `.set` proxy -- just enh.get(emc) plus direct property assignment. The button goes outside the element (afterend), so this also checks that deleting removes the button too. -->
    <div id="container">
        <label>
            <input type="checkbox" name="">
            <span>Check me out</span>
        </label>
    </div>
    <div id="target"></div>
    <script type=module>
        import {defBeDelible} from '/def.js';
        const subject = container.querySelector('label');
        const emc = await defBeDelible(document.body);
        Object.assign(subject.enh.get(emc), {
            buttonContent: 'Delete',
            triggerInsertPosition: 'afterend',
        });
        const fail = reason => target.setAttribute('mark', reason);
        setTimeout(() => {
            const trigger = container.querySelector('button.be-delible-trigger');
            if(trigger === null) return fail('no trigger button added');
            if(subject.enh.beDelible.resolved !== true) return fail('resolved not set');
            if(trigger.textContent !== 'Delete') return fail(`unexpected button content ${trigger.textContent}`);
            if(trigger !== subject.nextElementSibling) return fail('trigger not inserted afterend');
            trigger.click();
            setTimeout(() => {
                if(subject.isConnected) return fail('element not deleted');
                if(trigger.isConnected) return fail('trigger not deleted');
                target.setAttribute('mark', 'good');
            }, 200);
        }, 500);
    </script>
</body>
</html>
