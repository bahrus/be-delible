<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

<body>
    <label be-delible>
        <input type="checkbox" name="">
        <span>Check me out</span>
    </label>
    <div id=target></div>
    <script>
        function runTest(){
            document.querySelector('button').click();
            setTimeout(() => {
                if(document.querySelector('label') === null){
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 500);
    </script>
    <script type=module>
        import '/emc.js';
    </script>
</body>
